[project]
name = "chloe"
version = "0.1.0"
description = "Resource optimization scheduler for Claude Code subscriptions"
license = "MIT"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "networkx>=3.2",
    "rich>=13.7",
    "mcp>=1.0",
    "typer>=0.9",
    "jinja2>=3.1",
]

[project.optional-dependencies]
solver = ["ortools>=9.9"]
web = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
]
all = ["ortools>=9.9", "fastapi>=0.115", "uvicorn[standard]>=0.30", "python-multipart>=0.0.9"]

[project.scripts]
chloe = "chloe.cli.main:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=1.3.0",
    "ortools>=9.9",
    "httpx>=0.27",
]

[tool.hatch.build.targets.wheel]
packages = ["chloe"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
