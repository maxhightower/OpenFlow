[project]
name = "claudeflow"
version = "0.1.0"
description = "Resource optimization scheduler for Claude Code subscriptions"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "networkx>=3.2",
    "rich>=13.7",
    "textual>=0.50",
    "ortools>=9.9",
    "mcp>=1.0",
    "typer>=0.9",
    "jinja2>=3.1",
]

[project.scripts]
claudeflow = "claude_flow.cli.main:app"

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.hatch.build.targets.wheel]
packages = ["claude_flow"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
